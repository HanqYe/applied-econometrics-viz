<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualization for Applied Econometrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(0.155 0.006 60);
  --bg-2: oklch(0.185 0.007 60);
  --bg-3: oklch(0.225 0.009 62);
  --line: oklch(0.34 0.008 60);
  --line-soft: oklch(0.27 0.007 60);
  --ink: oklch(0.965 0.004 85);
  --ink-2: oklch(0.75 0.006 78);
  --ink-3: oklch(0.55 0.006 70);
  --paper: oklch(0.955 0.008 85);
  --accent: #58C4DD;
  --accent-soft: color-mix(in oklab, var(--accent) 18%, transparent);
  --accent-line: color-mix(in oklab, var(--accent) 42%, var(--line));
  --sans: "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: "STIX Two Text", Georgia, "Times New Roman", serif;
  --maxw: 1360px;
}
*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
a{ color: var(--accent); text-decoration: none; }
a:hover{ color: color-mix(in oklab, var(--accent) 72%, white); }
sup{ font-size: 0.5em; vertical-align: super; font-weight: 500; }
::selection{ background: var(--accent-soft); }

.page{ position: relative; }
.eyebrow{
  font-family: var(--serif); font-style: italic; font-size: 15px;
  color: var(--ink-2); letter-spacing: 0.01em; margin: 0 0 30px;
}
.eyebrow.center{ text-align: center; margin-bottom: 40px; }
.arr{ font-style: normal; font-family: var(--sans); }

/* ---------- buttons ---------- */
.btn{
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--sans); font-weight: 600; font-size: 14px;
  padding: 11px 17px; border-radius: 9px; border: 1px solid transparent;
  cursor: pointer; transition: transform .18s ease, background .2s ease, border-color .2s ease, color .2s ease;
  white-space: nowrap;
}
.btn.lg{ font-size: 15.5px; padding: 15px 24px; border-radius: 11px; }
.btn-light{ background: var(--paper); color: #1a1714; }
.btn-light:hover{ background: #fff; color: #000; transform: translateY(-1px); }
.btn-ghost{ background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover{ border-color: var(--accent); color: var(--ink); transform: translateY(-1px); }
.btn-ghost .arr{ color: var(--accent); }
.btn-icon{
  padding: 0; width: 40px; height: 40px; justify-content: center;
  font-size: 17px; background: var(--bg-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 9px;
}
.btn-icon:hover{ border-color: var(--accent); color: var(--accent); }

/* ---------- nav ---------- */
.nav{
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px; padding: 20px clamp(20px, 4vw, 54px);
  transition: background .3s ease, border-color .3s ease, padding .3s ease;
  border-bottom: 1px solid transparent;
}
.nav-solid{
  background: color-mix(in oklab, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft); padding-top: 14px; padding-bottom: 14px;
}
.brand{ display: inline-flex; align-items: center; gap: 10px; color: var(--ink); }
.brand:hover{ color: var(--ink); }
.brand-mark{ display: inline-flex; }
.brand-name{ font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.nav-links{ display: flex; gap: 30px; margin-left: auto; }
.nav-links a{
  color: var(--ink-2); font-size: 14px; font-weight: 500;
  transition: color .18s ease;
}
.nav-links a:hover{ color: var(--ink); }
.nav-cta{ display: flex; align-items: center; gap: 10px; }

/* ---------- hero ---------- */
.hero{
  position: relative; min-height: 100vh; display: flex; flex-direction: column;
  justify-content: center; padding: 150px clamp(20px, 4vw, 54px) 120px; overflow: hidden;
}
.hero-inner{ position: relative; z-index: 3; max-width: 900px; pointer-events: none; }
.hero-inner .he-entry, .hero-inner a, .hero-inner button{ pointer-events: auto; }

/* full-bleed Nightingale: gradient blur (left, under the text) -> sharp & solid (right) */
.hero-art{ position: absolute; top: 0; right: 0; bottom: 0; width: min(86%, 1280px); z-index: 1; }
.hero-art image-slot{ display: block; width: 100%; height: 100%; }
.hero-blur{
  position: absolute; inset: 0; pointer-events: none;
  -webkit-backdrop-filter: blur(17px); backdrop-filter: blur(17px);
  -webkit-mask-image: linear-gradient(to right, #000 0%, #000 36%, transparent 70%);
  mask-image: linear-gradient(to right, #000 0%, #000 36%, transparent 70%);
}
.hero-fade{
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to right, var(--bg) 0%, color-mix(in oklab, var(--bg) 55%, transparent) 40%, transparent 72%),
    linear-gradient(to top, var(--bg) 0%, transparent 24%);
}
.art-note{ max-width: 46ch; margin-top: 40px; text-align: left; }
.art-title{ font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ink-2); margin: 0 0 8px; letter-spacing: 0.02em; }
.art-line{ font-family: var(--serif); font-size: 14px; line-height: 1.6; color: var(--ink-2); margin: 0; text-wrap: pretty; }
.art-line em{ font-style: italic; color: var(--ink); }

/* quiet quote tag, top-right */
.hero-quote-tag{ position: absolute; z-index: 3; top: clamp(94px, 12vh, 140px); right: clamp(20px, 4vw, 54px); max-width: min(34vw, 340px); margin: 0; text-align: right; }
.hero-quote-tag blockquote{ margin: 0; font-family: var(--serif); font-style: italic; font-size: clamp(15px, 1.5vw, 20px); line-height: 1.42; color: var(--ink); text-wrap: balance; text-shadow: 0 1px 16px rgba(0,0,0,0.9), 0 0 34px rgba(0,0,0,0.55); }
.hero-quote-tag figcaption{ margin-top: 10px; font-family: var(--serif); font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 9px; align-items: baseline; text-shadow: 0 1px 12px rgba(0,0,0,0.85); }
.hero-quote-tag figcaption span{ font-style: italic; color: var(--ink-3); }

/* entry hub */
.hero-h{ font-family: var(--sans); font-weight: 600; font-size: clamp(30px, 4vw, 54px); letter-spacing: -0.025em; line-height: 1; margin: 16px 0 clamp(26px, 4vh, 42px); }
.hero-entries{ display: flex; flex-direction: column; gap: clamp(9px, 1.4vh, 15px); width: clamp(340px, 46vw, 560px); }
.he-entry{ display: flex; align-items: center; gap: 16px; color: var(--ink); transition: transform .2s ease; }
.he-entry.is-live{ cursor: pointer; }
.he-num{ font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--ink-3); min-width: 26px; }
.he-entry.is-live .he-num{ color: var(--accent); }
.he-pill{
  font-family: var(--sans); font-weight: 600; font-size: clamp(16px, 1.6vw, 21px); letter-spacing: -0.01em;
  white-space: nowrap; padding-bottom: 2px; border-bottom: 1.5px solid transparent;
  transition: color .2s ease, border-color .2s ease;
}
.he-entry.is-live:hover{ transform: translateX(5px); }
.he-entry.is-live:hover .he-pill{ color: var(--accent); border-bottom-color: var(--accent); }
.he-entry:not(.is-live) .he-pill{ color: var(--ink-3); }
.he-tail{ display: flex; align-items: center; gap: 12px; margin-left: auto; }
.he-arr{ color: var(--accent); font-size: 17px; opacity: 0; transform: translateX(-5px); transition: opacity .2s ease, transform .2s ease; }
.he-entry.is-live:hover .he-arr{ opacity: 1; transform: translateX(0); }
/* Promote to a caption beside the painting only on genuinely large desktops,
   so it never collides with the CTA row on short / narrow viewports. */
@media (min-width: 900px){
  .art-note{ position: absolute; z-index: 2; right: clamp(20px, 4vw, 54px); bottom: 104px; margin-top: 0; max-width: min(40vw, 360px); text-align: right; }
  .art-title{ text-shadow: 0 1px 12px rgba(0,0,0,0.7); }
  .art-line{ color: var(--ink); text-shadow: 0 1px 16px rgba(0,0,0,0.85); }
}
.hero-quote{
  font-family: var(--sans); font-weight: 600;
  font-size: clamp(44px, 7.2vw, 104px); line-height: 1.05;
  letter-spacing: -0.03em; margin: 0; max-width: 15ch;
  text-wrap: balance;
}
.hero-attr{
  font-family: var(--serif); font-style: italic; font-size: clamp(17px, 1.6vw, 22px);
  color: var(--ink); margin: 38px 0 0; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.hero-note{ font-size: 14px; color: var(--ink-3); font-style: normal; font-family: var(--sans); }
.hero-sub{
  max-width: 54ch; color: var(--ink-2); font-size: clamp(15px, 1.35vw, 18px);
  line-height: 1.6; margin: 30px 0 0; text-wrap: pretty;
}
.hero-actions{ display: flex; gap: 16px; margin-top: 52px; flex-wrap: wrap; }
.hero-foot{
  position: absolute; left: clamp(20px, 4vw, 54px); right: clamp(20px, 4vw, 54px); bottom: 34px;
  z-index: 2; display: flex; gap: 34px; flex-wrap: wrap;
  border-top: 1px solid var(--line-soft); padding-top: 20px;
  font-size: 13px; color: var(--ink-2); font-weight: 500; letter-spacing: 0.02em;
}
.hf-item{ position: relative; }
.hf-item.dim{ color: var(--ink-3); font-style: italic; font-family: var(--serif); }

/* ---------- sections ---------- */
.section{
  max-width: var(--maxw); margin: 0 auto; padding: clamp(80px, 11vh, 150px) clamp(20px, 4vw, 54px);
}
.sec-head{
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 24px; margin-bottom: 52px; flex-wrap: wrap;
}
.sec-title{
  font-weight: 800; font-size: clamp(34px, 5vw, 66px); letter-spacing: -0.03em;
  margin: 0; line-height: 1;
}
.sec-meta{ color: var(--ink-3); font-size: 14px; font-family: var(--serif); font-style: italic; }

/* ---------- status chips ---------- */
.st{
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 100px; border: 1px solid var(--line);
  color: var(--ink-2); white-space: nowrap;
}
.st-dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 0 var(--accent-soft); animation: pulse 2.4s ease-out infinite; }
.st-live{ color: var(--ink); border-color: var(--accent-line); }
.st-future{ color: var(--ink-3); border-style: dashed; }
@keyframes pulse{ 0%{ box-shadow: 0 0 0 0 var(--accent-soft);} 70%{ box-shadow: 0 0 0 7px transparent;} 100%{ box-shadow: 0 0 0 0 transparent;} }

/* ---------- cards (shared by cards + grid) ---------- */
.viz-card{
  position: relative; display: flex; flex-direction: column;
  background: var(--bg-2); border: 1px solid var(--line-soft); border-radius: 16px;
  padding: 24px 24px 22px; color: var(--ink); min-height: 300px;
  transition: transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease;
}
.viz-card.is-live{ cursor: pointer; }
.viz-card.is-live:hover{
  transform: translateY(-4px); border-color: var(--accent-line); background: var(--bg-3);
  box-shadow: 0 20px 50px -30px color-mix(in oklab, var(--accent) 60%, black);
}
.viz-card.is-future{ background: transparent; border-style: dashed; border-color: var(--line-soft); }
.card-top{ display: flex; align-items: center; justify-content: space-between; }
.card-num{ font-family: var(--serif); font-size: 34px; font-weight: 500; color: var(--ink-3); letter-spacing: -0.02em; }
.viz-card.is-live .card-num{ color: var(--accent); }
.card-body{ margin-top: auto; padding-top: 40px; }
.card-title{ font-size: 25px; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.05; }
.card-topic{ font-family: var(--serif); font-style: italic; color: var(--ink-2); font-size: 15px; margin: 9px 0 0; }
.card-blurb{ color: var(--ink-2); font-size: 14px; line-height: 1.55; margin: 14px 0 0; text-wrap: pretty; }
.viz-card.is-future .card-title, .viz-card.is-future .card-blurb{ color: var(--ink-3); }
.card-foot{ margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.card-go{ font-size: 13.5px; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 7px; }
.card-go.muted{ color: var(--ink-3); font-weight: 500; }
.card-go .arr{ transition: transform .2s ease; }
.viz-card.is-live:hover .card-go .arr{ transform: translate(2px, -2px); }

/* cards layout: horizontal rail */
.gal-rail-wrap{ position: relative; }
.gal-rail{
  display: flex; gap: 20px; overflow-x: auto; padding: 6px 4px 26px;
  scrollbar-width: none; -ms-overflow-style: none;
}
.gal-rail::-webkit-scrollbar{ display: none; }
.gal-rail .viz-card{ flex: 0 0 clamp(280px, 30vw, 360px); }

/* grid layout */
.gal-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }

/* ---------- list layout ---------- */
.gal-list{ border-top: 1px solid var(--line-soft); }
.gal-list:hover .viz-row{ opacity: 0.42; }
.viz-row{
  display: flex; align-items: center; gap: 28px;
  padding: 26px 12px; border-bottom: 1px solid var(--line-soft);
  color: var(--ink); transition: opacity .25s ease, padding .25s ease, background .25s ease;
}
.gal-list .viz-row:hover{ opacity: 1; padding-left: 24px; background: color-mix(in oklab, var(--bg-2) 60%, transparent); }
.viz-row.is-live{ cursor: pointer; }
.row-num{ font-family: var(--serif); font-size: 22px; color: var(--ink-3); min-width: 40px; }
.viz-row.is-live .row-num{ color: var(--accent); }
.row-main{ display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.row-title{ font-size: clamp(22px, 3vw, 36px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.viz-row.is-future .row-title{ color: var(--ink-3); font-family: var(--serif); font-style: italic; font-weight: 400; }
.row-topic{ font-family: var(--serif); font-style: italic; color: var(--ink-2); font-size: 15px; }
.row-right{ display: flex; align-items: center; gap: 18px; }
.row-arr{ color: var(--accent); font-size: 20px; opacity: 0; transform: translateX(-6px); transition: opacity .2s ease, transform .2s ease; }
.viz-row.is-live:hover .row-arr{ opacity: 1; transform: translateX(0); }

/* ---------- topics strip ---------- */
.topics{ border-top: 1px solid var(--line-soft); }
.topic-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 16px; overflow: hidden; }
.topic-cell{ background: var(--bg); padding: 40px 34px; }
.topic-k{ font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 12px; }
.topic-v{ color: var(--ink-2); font-size: 15px; line-height: 1.6; margin: 0; font-family: var(--serif); }

/* ---------- footer ---------- */
.footer{ border-top: 1px solid var(--line-soft); margin-top: 40px; padding: clamp(60px, 8vh, 100px) clamp(20px, 4vw, 54px) 40px; max-width: var(--maxw); margin-left: auto; margin-right: auto; }
.foot-main{ display: flex; justify-content: space-between; gap: 60px; flex-wrap: wrap; }
.foot-brand{ display: flex; gap: 18px; max-width: 460px; }
.foot-name{ font-weight: 700; font-size: 18px; margin: 2px 0 0; }
.foot-desc{ color: var(--ink-2); font-size: 14px; line-height: 1.6; margin: 12px 0 0; font-family: var(--serif); }
.foot-cols{ display: flex; gap: 64px; }
.foot-col{ display: flex; flex-direction: column; gap: 12px; }
.foot-h{ font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 0 0 4px; }
.foot-col a{ color: var(--ink-2); font-size: 14.5px; }
.foot-col a:hover{ color: var(--accent); }
.foot-col .muted{ color: var(--ink-3); font-size: 14.5px; }
.foot-bar{ display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 70px; padding-top: 22px; border-top: 1px solid var(--line-soft); color: var(--ink-3); font-size: 12.5px; }

.muted{ color: var(--ink-3); }

@media (max-width: 980px){
  .hero{ min-height: auto; padding-top: 130px; padding-bottom: 90px; }
  .hero-art{ width: 72%; }
  .hero-fade{ background:
    linear-gradient(to right, var(--bg) 0%, color-mix(in oklab, var(--bg) 62%, transparent) 42%, transparent 78%),
    linear-gradient(to top, var(--bg) 0%, transparent 26%); }
}
@media (max-width: 680px){
  .hero-art{ width: 100%; }
  .hero-blur{ -webkit-mask-image: none; mask-image: none; -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px); }
  .hero-fade{ background: color-mix(in oklab, var(--bg) 74%, transparent); }
  .hero-quote-tag{ position: static; max-width: none; text-align: left; margin-bottom: 26px; }
  .hero-quote-tag blockquote, .hero-quote-tag figcaption{ text-shadow: none; }
}
@media (max-width: 860px){
  .nav-links{ display: none; }
  .brand-name{ font-size: 13px; max-width: 180px; }
  .topic-grid{ grid-template-columns: 1fr; }
  .hero-inner{ max-width: 100%; }
  .hero-foot{ display: none; }
  .hero{ min-height: auto; padding-top: 130px; }
}
</style>
</head>
<body>
<div id="top"></div>
<div id="root"></div>
<style id="__om-edit-overrides"></style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="image-slot.js"></script>
<script type="text/babel" src="viz-entries.jsx"></script>
<script type="text/babel" src="viz-app.jsx"></script>
</body>
